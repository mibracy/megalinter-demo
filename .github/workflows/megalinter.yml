name: MegaLinter

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run MegaLinter
        uses: oxsecurity/megalinter@8fbdead70d1409964ab3d5afa885e18ee85388bb # v9.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only lint changed files on PRs
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' }}

      - name: Upload MegaLinter artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8f309081b5166a48b4c5def16a3d28ad6e # v4.2.0
        with:
          name: megalinter-reports
          path: |
            megalinter-reports/
          retention-days: 5
